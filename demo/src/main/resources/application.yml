cors:
  originPatterns: http://localhost:8080,https://google.com

security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 3600000
email:
  subject: "Default Subject"
  message: "Default Message"

spring:
  application:
    name: demo-rest_api-2025
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/person_api?useTimezone=true&serverTimezone=UTC
    username: root
    password: root_password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
      show-sql: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USER_SENDER}
    password: ${EMAIL_USER_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  flyway:
    baseline-on-migrate: true   # ✅ CORRETO
    enabled: true               # opcional, mas deixa explícito

logging:
  level:
    root: INFO